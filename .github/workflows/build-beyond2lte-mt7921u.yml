- name: Build kernel with NetHunter defconfig
  shell: bash
  run: |
    set -euxo pipefail

    WORKSPACE="${GITHUB_WORKSPACE}"
    KERNEL_OUT="$WORKSPACE/out"
    BACKPORTS_DIR="$WORKSPACE/backports"
    ARTIFACTS_DIR="$WORKSPACE/artifacts"
    ANYKERNEL_DIR="$WORKSPACE/anykernel"

    mkdir -p "$KERNEL_OUT" "$BACKPORTS_DIR" "$ARTIFACTS_DIR" "$ANYKERNEL_DIR"

    # Copy NetHunter defconfig for beyond2lte
    cp nh_files/exynos9820-beyond2lte_defconfig "$KERNEL_OUT/.config"

    # Prepare kernel
    cd "$KERNEL_OUT"
    make ARCH=arm64 oldconfig
    make ARCH=arm64 prepare
    make ARCH=arm64 modules_prepare

    # Compile kernel
    make -j$(nproc) ARCH=arm64 2>&1 | tee build.log

    # Backports (Wi-Fi)
    cd "$BACKPORTS_DIR"
    tar xf backports-6.1.97-1.tar.xz --strip-components=1
    make ARCH=arm64 O="$BACKPORTS_DIR" \
      KERNEL_DIR="$KERNEL_OUT" \
      modules -j$(nproc)

    # Collect .ko files
    mkdir -p "$ARTIFACTS_DIR/backports-modules"
    find "$BACKPORTS_DIR" -type f -name "*.ko" -exec cp {} "$ARTIFACTS_DIR/backports-modules/" \;

    # Create AnyKernel3 zip
    git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git anykernel
    cp "$KERNEL_OUT/arch/arm64/boot/Image" "$ANYKERNEL_DIR/"
    cp "$KERNEL_OUT/arch/arm64/boot/"*.dtb "$ANYKERNEL_DIR/" || true
    cp "$KERNEL_OUT/arch/arm64/boot/dtbo.img" "$ANYKERNEL_DIR/" || true
    cp "$ARTIFACTS_DIR/backports-modules/"*.ko "$ANYKERNEL_DIR/modules/system/lib/modules/" || true
    sed -i 's/device.name1=.*/device.name1=beyond2lte/' "$ANYKERNEL_DIR/anykernel.sh"
    sed -i 's/device.name2=.*/device.name2=SM-G975F/' "$ANYKERNEL_DIR/anykernel.sh"
    cd "$ANYKERNEL_DIR"
    zip -r9 "../beyond2lte-kernel-mt7921u.zip" *
    mv ../beyond2lte-kernel-mt7921u.zip "$ARTIFACTS_DIR/"
