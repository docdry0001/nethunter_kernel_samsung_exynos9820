name: Build NetHunter Kernel (beyond2lte + mt7921u backports)

on:
  workflow_dispatch:
    inputs:
      kernel_branch:
        description: "Kernel branch to build"
        required: true
        default: "nethunter-lineage-23.2"
      device_codename:
        description: "Device codename"
        required: true
        default: "beyond2lte"
      android_flavor:
        description: "ROM/Android flavor label"
        required: true
        default: "lineage-23.2"
      enable_ccache:
        description: "Enable ccache"
        required: true
        default: "true"
      package_logs:
        description: "Upload build logs"
        required: true
        default: "true"

permissions:
  contents: read

env:
  TZ: UTC
  KERNEL_BRANCH: ${{ github.event.inputs.kernel_branch }}
  DEVICE_CODENAME: ${{ github.event.inputs.device_codename }}
  ANDROID_FLAVOR: ${{ github.event.inputs.android_flavor }}
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  BUILD_LOG: ${{ github.workspace }}/build.log
  BACKPORTS_URL: https://cdn.kernel.org/pub/linux/kernel/projects/backports/stable/v6.1.97/backports-6.1.97-1.tar.xz
  BACKPORTS_DIR: ${{ github.workspace }}/backports
  ARTIFACTS_DIR: ${{ github.workspace }}/artifacts

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 240

    steps:
      - name: Checkout kernel tree
        uses: actions/checkout@v4
        with:
          ref: ${{ env.KERNEL_BRANCH }}
          submodules: recursive
          fetch-depth: 0

      - name: Install build dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            clang \
            cmake \
            cpio \
            curl \
            device-tree-compiler \
            flex \
            gawk \
            gcc \
            git \
            git-lfs \
            kmod \
            libelf-dev \
            libncurses-dev \
            libssl-dev \
            lld \
            llvm \
            lz4 \
            pahole \
            python3 \
            python3-pip \
            rsync \
            unzip \
            wget \
            xz-utils \
            zip \
            zstd \
            ca-certificates

      - name: Show tree info
        shell: bash
        run: |
          set -euxo pipefail
          echo "Branch: $(git rev-parse --abbrev-ref HEAD)"
          echo "Commit: $(git rev-parse HEAD)"
          echo "Workspace: ${GITHUB_WORKSPACE}"
          ls -la
          echo "==== build.config files ===="
          find . -maxdepth 2 -type f | grep 'build.config' || true
          echo "==== likely defconfigs ===="
          find arch/arm64/configs -type f | grep -E 'beyond|universal9820|exynos9820' || true
          echo "==== builder dir ===="
          ls -la kali-nethunter-kernel-builder || true

      - name: Enable ccache
        if: ${{ github.event.inputs.enable_ccache == 'true' }}
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-${{ env.DEVICE_CODENAME }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ env.DEVICE_CODENAME }}-

      - name: Prepare local.config
        shell: bash
        run: |
          set -euxo pipefail

          BUILDER_DIR="${GITHUB_WORKSPACE}/kali-nethunter-kernel-builder"
          mkdir -p "${BUILDER_DIR}"

          if [ -f "${GITHUB_WORKSPACE}/nh_files/local.config" ]; then
            cp "${GITHUB_WORKSPACE}/nh_files/local.config" "${BUILDER_DIR}/local.config"
          else
            printf "%s\n" \
              "#!/bin/bash" \
              "" \
              "export ARCH=arm64" \
              "export SUBARCH=arm64" \
              "CLANG_SRC=\"https://kali.download/nethunter-images/toolchains/google_clang-10.0.4.tar.xz\"" \
              "CLANG_SRC_TYPE=\"wget\"" \
              "export CLANG_ROOT=\${TD}/clang-10.0" \
              "CROSS_COMPILE_ARM32_SRC=\"https://kali.download/nethunter-images/toolchains/linaro-armhf-5.5.tar.xz\"" \
              "CROSS_COMPILE_ARM32_TYPE=\"wget\"" \
              "CCD32=\"\${TD}/linaro-armhf-5.5\"" \
              "export CROSS_COMPILE_ARM32=\${CCD32}/bin/arm-linux-gnueabihf-" \
              "CROSS_COMPILE_SRC=\"https://kali.download/nethunter-images/toolchains/linaro-aarch64-5.5.tar.xz\"" \
              "CROSS_COMPILE_TYPE=\"wget\"" \
              "CCD64=\"\${TD}/linaro-aarch64-5.5\"" \
              "export CROSS_COMPILE=\${CCD64}/bin/aarch64-linux-gnu-" \
              "MAKE_ARGS=\"CONFIG_NO_ERROR_ON_MISMATCH=y\"" \
              "CCACHE=true" \
              "export LOCALVERSION=-v0lk3n-beyond2lte_los-23.2" \
              "DEVICE=beyond2lte" \
              "KERNEL_DEFCONFIG=exynos9820-beyond2lte_defconfig" \
              "KERNEL_CONFIG=build.config.universal9820" \
              > "${BUILDER_DIR}/local.config"
          fi

          sed -i 's/^DEVICE=.*/DEVICE=beyond2lte/' "${BUILDER_DIR}/local.config" || true

          if grep -q '^KERNEL_DEFCONFIG=' "${BUILDER_DIR}/local.config"; then
            sed -i 's/^KERNEL_DEFCONFIG=.*/KERNEL_DEFCONFIG=exynos9820-beyond2lte_defconfig/' "${BUILDER_DIR}/local.config"
          else
            printf '%s\n' 'KERNEL_DEFCONFIG=exynos9820-beyond2lte_defconfig' >> "${BUILDER_DIR}/local.config"
          fi

          if grep -q '^KERNEL_CONFIG=' "${BUILDER_DIR}/local.config"; then
            sed -i 's|^KERNEL_CONFIG=.*|KERNEL_CONFIG=build.config.universal9820|' "${BUILDER_DIR}/local.config"
          else
            printf '%s\n' 'KERNEL_CONFIG=build.config.universal9820' >> "${BUILDER_DIR}/local.config"
          fi

          if grep -q '^export LOCALVERSION=' "${BUILDER_DIR}/local.config"; then
            sed -i 's/^export LOCALVERSION=.*/export LOCALVERSION=-v0lk3n-beyond2lte_los-23.2/' "${BUILDER_DIR}/local.config"
          else
            printf '%s\n' 'export LOCALVERSION=-v0lk3n-beyond2lte_los-23.2' >> "${BUILDER_DIR}/local.config"
          fi

          echo "==== final local.config ===="
          cat "${BUILDER_DIR}/local.config"

      - name: Download and extract backports
        shell: bash
        run: |
          set -euxo pipefail

          cd "${GITHUB_WORKSPACE}"
          rm -rf "${BACKPORTS_DIR}" backports-* backports.tar.xz

          wget -O backports.tar.xz "${BACKPORTS_URL}"
          tar -xf backports.tar.xz

          EXTRACTED_DIR="$(find "${GITHUB_WORKSPACE}" -maxdepth 1 -mindepth 1 -type d -name 'backports-*' | head -n1)"

          if [ -z "${EXTRACTED_DIR}" ]; then
            echo "Backports extracted directory not found"
            ls -la "${GITHUB_WORKSPACE}"
            exit 1
          fi

          mv "${EXTRACTED_DIR}" "${BACKPORTS_DIR}"

          echo "==== workspace after extraction ===="
          ls -la "${GITHUB_WORKSPACE}"
          echo "==== backports dir ===="
          ls -la "${BACKPORTS_DIR}"

      - name: Prepare backports config
        shell: bash
        run: |
          set -euxo pipefail

          [ -d "${BACKPORTS_DIR}" ] || { echo "BACKPORTS_DIR missing: ${BACKPORTS_DIR}"; ls -la "${GITHUB_WORKSPACE}"; exit 1; }

          cd "${BACKPORTS_DIR}"

          make defconfig-wifi || make defconfig

          CONFIG_FILE=".config"

          set_cfg() {
            KEY="$1"
            VAL="$2"
            sed -i "/^${KEY}=.*/d" "${CONFIG_FILE}" || true
            sed -i "/^# ${KEY} is not set/d" "${CONFIG_FILE}" || true
            printf '%s=%s\n' "${KEY}" "${VAL}" >> "${CONFIG_FILE}"
          }

          set_cfg CONFIG_CFG80211 m
          set_cfg CONFIG_MAC80211 m
          set_cfg CONFIG_WLAN y
          set_cfg CONFIG_WLAN_VENDOR_MEDIATEK y
          set_cfg CONFIG_MT76_CORE m
          set_cfg CONFIG_MT76_USB m
          set_cfg CONFIG_MT76_CONNAC_LIB m
          set_cfg CONFIG_MT76_CONNAC_MAC m
          set_cfg CONFIG_MT76_LEDS y
          set_cfg CONFIG_MT792x_LIB m
          set_cfg CONFIG_MT7921_COMMON m
          set_cfg CONFIG_MT7921U m

          make olddefconfig

          echo "==== final backports .config ===="
          grep -E 'CONFIG_(CFG80211|MAC80211|WLAN_VENDOR_MEDIATEK|MT76|MT792)' .config || true

      - name: Build NetHunter kernel
        shell: bash
        run: |
          set -euxo pipefail
          cd "${GITHUB_WORKSPACE}/kali-nethunter-kernel-builder"
          chmod +x ./build.sh
          ./build.sh 2>&1 | tee "${BUILD_LOG}"

      - name: Discover kernel output tree
        shell: bash
        run: |
          set -euxo pipefail

          FOUND=""

          CANDIDATES=(
            "${GITHUB_WORKSPACE}/out"
            "${GITHUB_WORKSPACE}/kernel_platform/out"
            "${GITHUB_WORKSPACE}/kernel_platform/msm-kernel/out"
            "${GITHUB_WORKSPACE}/common/out"
            "${GITHUB_WORKSPACE}/arch/arm64/boot"
          )

          for d in "${CANDIDATES[@]}"; do
            if [ -d "${d}" ]; then
              FOUND="${d}"
              break
            fi
          done

          if [ -z "${FOUND}" ]; then
            FOUND="$(find "${GITHUB_WORKSPACE}" -type d -name out | head -n1 || true)"
          fi

          if [ -z "${FOUND}" ]; then
            echo "Could not locate kernel output tree"
            find "${GITHUB_WORKSPACE}" -maxdepth 4 -type d | sort | sed -n '1,300p'
            exit 1
          fi

          echo "KERNEL_OUT=${FOUND}" >> "${GITHUB_ENV}"
          echo "Resolved KERNEL_OUT=${FOUND}"

      - name: Build backports modules
        shell: bash
        run: |
          set -euxo pipefail

          [ -d "${BACKPORTS_DIR}" ] || { echo "BACKPORTS_DIR missing"; exit 1; }
          [ -d "${KERNEL_OUT}" ] || { echo "KERNEL_OUT missing: ${KERNEL_OUT}"; exit 1; }

          cd "${BACKPORTS_DIR}"

          make -j"$(nproc)" \
            KLIB_BUILD="${KERNEL_OUT}" \
            KLIB="${KERNEL_OUT}" \
            2>&1 | tee -a "${BUILD_LOG}"

      - name: Collect backports modules
        if: always()
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p "${ARTIFACTS_DIR}/backports-modules"

          find "${BACKPORTS_DIR}" -type f -name '*.ko' -exec cp {} "${ARTIFACTS_DIR}/backports-modules/" \; || true

          echo "==== backports modules ===="
          find "${ARTIFACTS_DIR}/backports-modules" -type f | sort || true

      - name: Collect kernel artifacts
        if: always()
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p "${ARTIFACTS_DIR}/kernel"

          find "${GITHUB_WORKSPACE}" -type f \( \
            -iname '*.zip' -o \
            -iname '*.img' -o \
            -iname 'Image*' -o \
            -iname 'dtb*' -o \
            -iname 'dtbo*' \
          \) \
            -not -path '*/.git/*' \
            -not -path '*/backports/*' \
            -exec cp --parents {} "${ARTIFACTS_DIR}/kernel/" \; || true

          if [ -f "${BUILD_LOG}" ]; then
            cp "${BUILD_LOG}" "${ARTIFACTS_DIR}/" || true
          fi

          echo "==== collected artifacts ===="
          find "${ARTIFACTS_DIR}" -type f | sort || true

      - name: Create backports modules zip
        if: always()
        shell: bash
        run: |
          set -euxo pipefail

          cd "${ARTIFACTS_DIR}"
          if [ -d backports-modules ]; then
            zip -r "mt7921u-backports-modules-${{ github.run_number }}.zip" backports-modules || true
          fi

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nethunter-beyond2lte-mt7921u-${{ github.run_number }}
          path: artifacts/**
          if-no-files-found: warn
          compression-level: 6

      - name: Upload build log separately
        if: ${{ always() && github.event.inputs.package_logs == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_number }}
          path: ${{ env.BUILD_LOG }}
          if-no-files-found: warn
